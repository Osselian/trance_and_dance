version: "3.8"

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.2.0
    container_name: elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9205:9200"
    networks:
      - monitoring-tier
    restart: always

  logstash:
    image: docker.elastic.co/logstash/logstash:8.2.0
    container_name: logstash
    volumes:
      - ./devops/logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "12201:12201/udp"
      - "9600:9600/tcp"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    networks:
      - monitoring-tier
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:8.2.0
    container_name: kibana
    volumes:
      - ./devops/kibana/export.ndjson:/tmp/export.ndjson:ro
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      # если у вас включён ssl в ES, добавьте CA:
      # ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: "/path/to/ca.pem"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      retries: 10
    networks:
      - monitoring-tier
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always

  kibana-import:
    image: curlimages/curl:7.88.1
    container_name: kibana-import
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo "→ Импорт Saved Objects в Kibana…"
        curl -X POST http://kibana:5601/api/saved_objects/_import?overwrite=true \
          -H 'kbn-xsrf: true' \
          --form file=@/tmp/export.ndjson \
        && echo "✔️ Импорт завершён."
    volumes:
      - ./devops/kibana/export.ndjson:/tmp/export.ndjson:ro
    networks:
      - monitoring-tier
    restart: "no"

volumes:
  elasticsearch-data:

networks:
  monitoring-tier:
    driver: bridge